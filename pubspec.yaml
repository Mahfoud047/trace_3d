name: trace_3d
description: Visualiseur de traces GPX/TCX en 3D avec statistiques (distance, vitesse, dénivelé).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  file_picker: ^8.1.0
  xml: ^6.5.0
  fl_chart: ^0.69.0
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
